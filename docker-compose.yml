version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
    environment:
      - PB_JWT_SECRET=${PB_JWT_SECRET:-change-me-in-production}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped
